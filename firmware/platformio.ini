; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[env:bluepill_f103c8_128k]
platform = ststm32
board = bluepill_f103c8

; change microcontroller
board_build.mcu = stm32f103c8t6

; change MCU frequency
board_build.f_cpu = 72000000L

framework = stm32cube

; Includes de todas las capas (-I. resuelve hal/, app/, etc.)
build_flags = -D STM32F1
  -I.
  -Iinclude

  ; ⚠️ AQUI NO VA -flto. MEDIDO el 2026-10-02: libera 5 372 B (74,2 % -> 66,0 %),
  ; pero ROMPE LAS INTERRUPCIONES. Con LTO, los manejadores que define src/main.c
  ; (SysTick_Handler, USART3_IRQHandler, EXTI15_10_IRQHandler, HardFault_Handler...)
  ; se resuelven a los `__weak` VACIOS de la HAL que vienen en el .a del framework:
  ; el vector table acaba apuntando todos ellos a Default_Handler. Sin HAL_IncTick()
  ; `HAL_Delay()` se cuelga para siempre, sin EXTI no hay boton MENU y sin USART3 no
  ; hay consola. Sintoma en el robot: se queda mudo en el arranque.
  ; La causa y el diagnostico estan en Documentacion/entorno-desarrollo.md 3.1.

  ; ⚠️ AQUI ESTABA `-Wl,-u,_printf_float`, que forzaba el enlace del `%f` de newlib.
  ; Se retiro el 2026-10-10: la telemetria y todas las pantallas formatean ya con enteros
  ; (`app/format.c`), y el `%f` arrastraba `_dtoa_r` (2 920 B) MAS toda la aritmetica de
  ; doble precision (6 108 B), porque los argumentos de printf se promocionan a `double`.
  ; Medido: Flash 53 196 -> 43 716 B (-9 480 B, del 81,2 % al 66,7 %).
  ; ⚠️ Si algun dia se vuelve a usar un `%f`, hay que reponer esta linea: sin ella no
  ; falla la compilacion, simplemente los numeros salen mal.

; Script para añadir fuentes de todas las capas
extra_scripts = pre:extra_script.py

upload_protocol = stlink
upload_port = /dev/stlinkv2_2 

monitor_port = /dev/ttyUSB0
monitor_speed = 115200
